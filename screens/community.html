<!doctype html>
<html lang="vi" data-title-key="community.title">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title></title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="../components/index.css">
<script src="../brand/brand.js"></script>
<script src="../content/vi.js"></script>
<script src="../core/app.js"></script>
<script src="../core/speech.js"></script>
</head>
<body class="sv-device-host">
<div class="sv-device">
  <sv-status-bar></sv-status-bar>
  <sv-top-bar heading="community.title" back="features.html"></sv-top-bar>
  <main class="sv-device__screen">
    <div class="l-gutter sv-sub">
      <p class="t-body-m t-muted sv-sub-intro" data-t="community.intro"></p>
      <section class="l-section l-section--first">
        <sv-community-notify></sv-community-notify>
        <ul class="sv-list sv-list--after" role="list">
          <li><sv-list-item href="support.html" icon="add_location_alt" heading="community.suggest" sub="community.suggestSub"></sv-list-item></li>
        </ul>
      </section>
      <section class="l-section" aria-labelledby="community-places">
        <h2 class="sv-section-title" id="community-places" data-t="community.placesTitle"></h2>
        <sv-info-list key="community.items"></sv-info-list>
      </section>
      <p class="sv-page-note t-body-s"><span class="sv-icon" aria-hidden="true">info</span><span data-t="community.note"></span></p>
    </div>
  </main>
  <sv-nav-bar active="features"></sv-nav-bar>
  <div class="sv-gesture-bar" aria-hidden="true"></div>
</div>
<script src="../components/elements.js"></script>
<script src="../components/speech.js"></script>
<script src="../components/flows.js"></script>
</body>
</html>
