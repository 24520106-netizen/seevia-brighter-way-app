<!doctype html>
<html lang="vi" data-title-key="support.title">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title></title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="../components/index.css">
<script src="../brand/brand.js"></script>
<script src="../content/vi.js"></script>
<script src="../core/app.js"></script>
<script src="../core/speech.js"></script>
</head>
<body class="sv-device-host">
<div class="sv-device">
  <sv-status-bar></sv-status-bar>
  <sv-top-bar heading="support.title" back="home.html"></sv-top-bar>
  <main class="sv-device__screen">
    <div class="l-gutter sv-sub">
      <sv-hotline></sv-hotline>
      <div class="l-section l-section--first">
        <ul class="sv-list" role="list">
          <li><sv-list-item href="guide.html" icon="menu_book" heading="support.guide" sub="support.guideSub"></sv-list-item></li>
        </ul>
      </div>
      <section class="l-section" aria-labelledby="support-faq">
        <h2 class="sv-section-title" id="support-faq" data-t="support.faqTitle"></h2>
        <sv-accordion-list key="support.faq"></sv-accordion-list>
      </section>
      <section class="l-section" aria-labelledby="support-form">
        <h2 class="sv-section-title" id="support-form" data-t="support.formTitle"></h2>
        <sv-support-form></sv-support-form>
      </section>
    </div>
  </main>
  <sv-nav-bar active="profile"></sv-nav-bar>
  <div class="sv-gesture-bar" aria-hidden="true"></div>
</div>
<script src="../components/elements.js"></script>
<script src="../components/speech.js"></script>
<script src="../components/flows.js"></script>
</body>
</html>
