<!doctype html>
<html lang="vi" data-title-key="safety.title">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title></title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="../components/index.css">
<script src="../brand/brand.js"></script>
<script src="../content/vi.js"></script>
<script src="../core/app.js"></script>
<script src="../core/speech.js"></script>
</head>
<body class="sv-device-host">
<div class="sv-device">
  <sv-status-bar></sv-status-bar>
  <sv-top-bar heading="safety.title" variant="collapsing">
    <span class="sv-demo-tag"><span class="sv-icon" aria-hidden="true">science</span><span data-t="common.demoBadge"></span></span>
  </sv-top-bar>

  <main class="sv-device__screen">
    <div class="sv-page-title">
      <h1 class="t-headline-l" data-t="safety.title"></h1>
      <p class="t-body-m sv-page-title__lede" data-t="safety.intro"></p>
    </div>

    <div class="l-gutter">
      <section class="sv-card sv-sos-card l-section l-section--first">
        <sv-sos-button with-recipient></sv-sos-button>
      </section>

      <section class="l-section" aria-labelledby="safety-contact">
        <h2 class="sv-section-title" id="safety-contact" data-t="safety.contactTitle"></h2>
        <sv-emergency-contact></sv-emergency-contact>
      </section>

      <section class="l-section" aria-labelledby="safety-tips">
        <h2 class="sv-section-title" id="safety-tips" data-t="safety.tipsTitle"></h2>
        <ul class="sv-notes" role="list">
          <li>
            <span class="sv-icon" aria-hidden="true">touch_app</span>
            <span class="sv-notes__title" data-t="safety.tipTripleTitle"></span>
            <span class="sv-notes__body t-body-m" data-t="safety.tipTripleBody"></span>
          </li>
          <li>
            <span class="sv-icon" aria-hidden="true">blind</span>
            <span class="sv-notes__title" data-t="safety.tipCaneTitle"></span>
            <span class="sv-notes__body t-body-m" data-t="safety.tipCaneBody"></span>
          </li>
          <li>
            <span class="sv-icon" aria-hidden="true">science</span>
            <span class="sv-notes__title" data-t="safety.tipDemoTitle"></span>
            <span class="sv-notes__body t-body-m" data-t="safety.tipDemoBody"></span>
          </li>
        </ul>
      </section>
    </div>
  </main>

  <sv-nav-bar active="safety"></sv-nav-bar>
  <div class="sv-gesture-bar" aria-hidden="true"></div>
</div>
<script src="../components/elements.js"></script>
<script src="../components/speech.js"></script>
<script src="../components/flows.js"></script>
</body>
</html>
