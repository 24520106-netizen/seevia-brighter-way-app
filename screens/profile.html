<!doctype html>
<html lang="vi" data-title-key="profile.title">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title></title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="../components/index.css">
<script src="../brand/brand.js"></script>
<script src="../content/vi.js"></script>
<script src="../core/app.js"></script>
</head>
<body class="sv-device-host">
<div class="sv-device">
  <sv-status-bar></sv-status-bar>
  <sv-top-bar heading="profile.title" variant="collapsing">
    <span class="sv-demo-tag"><span class="sv-icon" aria-hidden="true">science</span><span data-t="common.demoBadge"></span></span>
  </sv-top-bar>
  <main class="sv-device__screen">
    <div class="sv-page-title">
      <h1 class="t-headline-l" data-t="profile.title"></h1>
    </div>
    <div class="l-gutter">
      <sv-profile-card></sv-profile-card>
      <section class="l-section l-section--first" aria-labelledby="profile-settings">
        <h2 class="sv-section-title" id="profile-settings" data-t="profile.settingsTitle"></h2>
        <sv-profile-settings></sv-profile-settings>
      </section>
      <section class="l-section" aria-labelledby="profile-about">
        <h2 class="sv-section-title" id="profile-about" data-t="profile.aboutTitle"></h2>
        <sv-version-tap></sv-version-tap>
      </section>
    </div>
  </main>
  <sv-nav-bar active="profile"></sv-nav-bar>
  <div class="sv-gesture-bar" aria-hidden="true"></div>
</div>
<script src="../components/elements.js"></script>
<script src="../components/flows.js"></script>
</body>
</html>
